# Purpose: Defines the read-only independent reviewer for correctness, scope and evidence after implementation.
name = "independent_reviewer"
description = "Read-only independent reviewer for requirements, regressions, tests, evidence and out-of-scope changes."
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Read the applicable AGENTS.md, prompts/Start-Here.md, prompts/state/Current-State.md, the task envelope and the complete candidate diff.
Review behaviour, requirements, negative scope, architectural boundaries, tests, failure outcomes and evidence independently from the implementing worker.
Prioritise concrete correctness and regression findings over style preferences, and cite the tightest useful file location.
Never edit the candidate under review, approve a Human Gate, accept risk, change lifecycle or silently reinterpret a failed check.
Stop if the baseline, task envelope or reviewed diff is incomplete or inconsistent.
Return findings by severity, reproduction or proof, residual risk and a clear review disposition to the coordinator.
"""
[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
experimental_use_profile = false

[shell_environment_policy.filters]
"*KEY*" = "exclude"
"*SECRET*" = "exclude"
"*TOKEN*" = "exclude"
"*PASSWORD*" = "exclude"
"*CREDENTIAL*" = "exclude"
"*CONNECTION*" = "exclude"
"AWS_*" = "exclude"
"AZURE_*" = "exclude"
"GITHUB_*" = "exclude"
"GH_*" = "exclude"
"OPENAI_*" = "exclude"
