# Purpose: Defines least-privilege setup validation only; it restores, builds, tests, and audits but never deploys.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-gate:
    name: Setup gate
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify pinned toolchains
        shell: pwsh
        run: |
          $expectedDotnet = (Get-Content global.json | ConvertFrom-Json).sdk.version
          $expectedNode = (Get-Content .nvmrc).Trim()
          if ((dotnet --version) -ne $expectedDotnet) {
            throw "Expected .NET SDK $expectedDotnet."
          }
          if ((node --version).TrimStart("v") -ne $expectedNode) {
            throw "Expected Node.js $expectedNode."
          }
          if ((npm --version) -ne "11.16.0") {
            throw "Expected npm 11.16.0."
          }

      - name: Run setup gate
        shell: pwsh
        run: ./eng/ci.ps1
