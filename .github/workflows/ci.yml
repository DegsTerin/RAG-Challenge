# Purpose: Defines least-privilege setup validation only; it restores, builds, tests, and audits but never deploys.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-gate:
    name: Setup gate
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./eng/ci-policy.ps1

          $expectedDotnet = (Get-Content global.json | ConvertFrom-Json).sdk.version
          $dashboardPackage = Get-Content src/RagChallenge.Dashboard.Web/package.json -Raw | ConvertFrom-Json
          $orchestratorPackage = Get-Content tools/ai-orchestrator/package.json -Raw | ConvertFrom-Json
          if ((dotnet --version) -ne $expectedDotnet) {
            throw "Expected .NET SDK $expectedDotnet."
          }

          $nodeVersion = (node --version).TrimStart("v")
          if ($LASTEXITCODE -ne 0) {
            throw "Node.js version discovery failed with exit code $LASTEXITCODE."
          }

          $npmVersion = npm --version
          if ($LASTEXITCODE -ne 0) {
            throw "npm version discovery failed with exit code $LASTEXITCODE."
          }

          Assert-VersionSatisfiesRange -Name "Node.js" -ActualVersion $nodeVersion -Range $dashboardPackage.engines.node
          Assert-VersionSatisfiesRange -Name "npm" -ActualVersion $npmVersion -Range $dashboardPackage.engines.npm
          Assert-VersionSatisfiesRange -Name "Node.js" -ActualVersion $nodeVersion -Range $orchestratorPackage.engines.node
          Assert-VersionSatisfiesRange -Name "npm" -ActualVersion $npmVersion -Range $orchestratorPackage.engines.npm

      - name: Run setup gate
        shell: pwsh
        run: ./eng/ci.ps1
