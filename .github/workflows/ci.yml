# Purpose: Defines least-privilege setup validation only; it restores, builds, tests, and audits but never deploys.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-gate:
    name: Setup gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Resolve language-check commit boundary
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SELECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $fullSha = '^[0-9a-f]{40}$'
          if ($env:SELECTED_HEAD -notmatch $fullSha -or $env:SELECTED_HEAD -eq ('0' * 40)) {
            throw "The event-selected head is missing or invalid."
          }
          $headOutput = & git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "The checked-out head could not be resolved."
          }
          $actualHead = $headOutput.Trim()
          if ($actualHead -notmatch $fullSha -or $actualHead -cne $env:SELECTED_HEAD) {
            throw "The checked-out head does not match the event-selected head."
          }
          if ($env:EVENT_NAME -eq 'pull_request') {
            if ($env:PULL_REQUEST_BASE -notmatch $fullSha -or $env:PULL_REQUEST_BASE -eq ('0' * 40)) {
              throw "The pull-request base is missing or invalid."
            }
            $mergeBaseOutput = @(& git merge-base -- $env:PULL_REQUEST_BASE $env:SELECTED_HEAD)
            if ($LASTEXITCODE -ne 0) {
              throw "The pull-request merge base could not be resolved."
            }
            $mergeBaseCandidates = @($mergeBaseOutput | ForEach-Object { $_.Trim() } | Where-Object { $_.Length -gt 0 })
            if ($mergeBaseCandidates.Count -ne 1 -or
                $mergeBaseCandidates[0] -notmatch $fullSha -or
                $mergeBaseCandidates[0] -eq ('0' * 40)) {
              throw "The pull-request merge base is missing or invalid."
            }
            $allMergeBaseOutput = @(& git merge-base --all -- $env:PULL_REQUEST_BASE $env:SELECTED_HEAD)
            if ($LASTEXITCODE -ne 0) {
              throw "The complete pull-request merge-base set could not be resolved."
            }
            $allMergeBaseCandidates = @($allMergeBaseOutput | ForEach-Object { $_.Trim() } | Where-Object { $_.Length -gt 0 })
            if ($allMergeBaseCandidates.Count -ne 1 -or
                $allMergeBaseCandidates[0] -cne $mergeBaseCandidates[0]) {
              throw "The pull-request merge base is ambiguous."
            }
            $mergeBase = $mergeBaseCandidates[0]
            & git merge-base --is-ancestor -- $mergeBase $env:SELECTED_HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "The pull-request merge base is not an ancestor of the selected head."
            }
            "RAG_LANGUAGE_COMMIT_BASE=$mergeBase" >> $env:GITHUB_ENV
          }
          elseif ($env:EVENT_NAME -eq 'push') {
            if ($env:PUSH_BEFORE -notmatch $fullSha -or $env:PUSH_BEFORE -eq ('0' * 40)) {
              throw "The push-before commit is missing or invalid."
            }
            "RAG_LANGUAGE_COMMIT_BASE=$env:PUSH_BEFORE" >> $env:GITHUB_ENV
          }
          elseif ($env:EVENT_NAME -eq 'workflow_dispatch') {
            "RAG_LANGUAGE_COMMIT_HEAD=$env:SELECTED_HEAD" >> $env:GITHUB_ENV
          }
          else {
            throw "The workflow event does not define a language-check boundary."
          }

      - name: Verify toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./eng/ci-policy.ps1

          $dotnetSdk = Get-Content global.json | ConvertFrom-Json | Select-Object -ExpandProperty sdk
          $expectedDotnet = $dotnetSdk.version
          $rollForward = $dotnetSdk.rollForward
          $dashboardPackage = Get-Content src/RagChallenge.Dashboard.Web/package.json -Raw | ConvertFrom-Json
          $orchestratorPackage = Get-Content tools/ai-orchestrator/package.json -Raw | ConvertFrom-Json
          $installedDotnet = (dotnet --version).Trim()
          if ($installedDotnet -match '^(\d+)\.(\d+)\.(\d+)') {
            $installedVersion = [System.Version]$matches[0]
          }
          else {
            throw "Unable to parse dotnet --version output '$installedDotnet'."
          }

          $expectedVersion = [System.Version]$expectedDotnet
          if ($installedVersion.Major -ne $expectedVersion.Major -or
              $installedVersion.Minor -ne $expectedVersion.Minor -or
              (($rollForward -eq "latestPatch") -and
              $installedVersion.Build -lt $expectedVersion.Build) -or
              ((-not $rollForward) -and ($installedVersion -ne $expectedVersion)) -or
              (($rollForward -ne "latestPatch") -and
              (-not [string]::IsNullOrWhiteSpace($rollForward)) -and
              $installedVersion -ne $expectedVersion)) {
            throw "Expected .NET SDK $expectedDotnet with latestPatch roll-forward when configured, found $installedDotnet."
          }

          $nodeVersion = (node --version).TrimStart("v")
          if ($LASTEXITCODE -ne 0) {
            throw "Node.js version discovery failed with exit code $LASTEXITCODE."
          }

          $npmVersion = npm --version
          if ($LASTEXITCODE -ne 0) {
            throw "npm version discovery failed with exit code $LASTEXITCODE."
          }

          Assert-VersionSatisfiesRange -Name "Node.js" -ActualVersion $nodeVersion -Range $dashboardPackage.engines.node
          Assert-VersionSatisfiesRange -Name "npm" -ActualVersion $npmVersion -Range $dashboardPackage.engines.npm
          Assert-VersionSatisfiesRange -Name "Node.js" -ActualVersion $nodeVersion -Range $orchestratorPackage.engines.node
          Assert-VersionSatisfiesRange -Name "npm" -ActualVersion $npmVersion -Range $orchestratorPackage.engines.npm

      - name: Run setup gate
        shell: pwsh
        run: ./eng/ci.ps1
