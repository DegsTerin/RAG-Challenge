# Purpose: Defines least-privilege setup validation only; it restores, builds, tests, and audits but never deploys.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-gate:
    name: Setup gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Verify toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./eng/ci-policy.ps1

          $dotnetSdk = Get-Content global.json | ConvertFrom-Json | Select-Object -ExpandProperty sdk
          $expectedDotnet = $dotnetSdk.version
          $rollForward = $dotnetSdk.rollForward
          $dashboardPackage = Get-Content src/RagChallenge.Dashboard.Web/package.json -Raw | ConvertFrom-Json
          $installedDotnet = (dotnet --version).Trim()
          if ($installedDotnet -match '^(\d+)\.(\d+)\.(\d+)') {
            $installedVersion = [System.Version]$matches[0]
          }
          else {
            throw "Unable to parse dotnet --version output '$installedDotnet'."
          }

          $expectedVersion = [System.Version]$expectedDotnet
          if ($installedVersion.Major -ne $expectedVersion.Major -or
              $installedVersion.Minor -ne $expectedVersion.Minor) {
            throw "Expected .NET SDK major/minor $($expectedVersion.Major).$($expectedVersion.Minor), found $installedDotnet."
          }

          if ($rollForward -eq "latestPatch") {
            if ($installedVersion.Build -lt $expectedVersion.Build) {
              throw "Expected .NET SDK patch >= $($expectedVersion.Build), found $installedDotnet."
            }
          }

          $nodeVersion = (node --version).TrimStart("v")
          if ($LASTEXITCODE -ne 0) {
            throw "Node.js version discovery failed with exit code $LASTEXITCODE."
          }

          $npmVersion = npm --version
          if ($LASTEXITCODE -ne 0) {
            throw "npm version discovery failed with exit code $LASTEXITCODE."
          }

          Assert-VersionSatisfiesRange -Name "Node.js" -ActualVersion $nodeVersion -Range $dashboardPackage.engines.node
          Assert-VersionSatisfiesRange -Name "npm" -ActualVersion $npmVersion -Range $dashboardPackage.engines.npm
      - name: Run setup gate
        shell: pwsh
        run: ./eng/ci.ps1
